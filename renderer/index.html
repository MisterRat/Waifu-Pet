<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <!-- Content-Security-Policy. 'wasm-unsafe-eval' lets the Live2D core (WebAssembly) start; it does not allow JS eval. Only this app's own files may load or run: no inline scripts, nothing from
       the internet. All network calls (chat, TTS) are made by the main process. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'" />
  <title>Waifu Pet</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
    }
    #stage {
      position: absolute;
      inset: 0;
    }
    #stage canvas {
      display: block;
    }
    /* Loading / error overlay */
    #status {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f0a8c8;
      font: 14px "Segoe UI", system-ui, sans-serif;
      background: rgba(26, 22, 38, 0.85);
      z-index: 20;
      text-align: center;
      padding: 20px;
    }
    #status.hidden { display: none; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <!-- Hidden until a real load error; no visible "loading" pause at startup. -->
  <div id="status" class="hidden"></div>

  <script src="../vendor/live2dcubismcore.min.js"></script>
  <script src="../vendor/pixi.min.js"></script>
  <!-- Pixi without eval (needed for the Content-Security-Policy above) -->
  <script src="../vendor/pixi-unsafe-eval.min.js"></script>
  <script src="../vendor/cubism4.min.js"></script>
  <script src="expressions.js"></script>
  <script src="idle.js"></script>
  <script src="tagParser.js"></script>
  <script src="lipsync.js"></script>
  <script src="debug.js"></script>
  <script src="pet.js"></script>
</body>
</html>
