<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <!-- Content-Security-Policy. 'wasm-unsafe-eval' lets conversation mode's voice detection (WebAssembly) start; it does not allow JS eval. Only this app's own files may load or run: no inline scripts, nothing from
       the internet. All network calls (chat, TTS) are made by the main process. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'" />
  <title>Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #1e1b2e;
      color: #e8e4f5;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #titlebar {
      -webkit-app-region: drag;
      padding: 8px 12px;
      background: #2a2540;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      user-select: none;
    }
    #titlebar button {
      -webkit-app-region: no-drag;
      background: none;
      border: 1px solid #4a4468;
      color: #e8e4f5;
      border-radius: 4px;
      padding: 2px 8px;
      cursor: pointer;
    }
    #titlebar button:disabled { opacity: 0.4; cursor: default; }
    #hush:not(:disabled) { border-color: #d0606a; color: #ffb3ba; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      max-width: 85%;
      padding: 7px 11px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #4a3f7a;
      border-bottom-right-radius: 3px;
    }
    .msg.pet {
      align-self: flex-start;
      background: #35304e;
      border-bottom-left-radius: 3px;
    }
    /* Code blocks: shown, never spoken. */
    .msg.pet.has-code { max-width: 95%; }
    .msg .code {
      margin: 6px 0;
      background: #15131f;
      border: 1px solid #4a4468;
      border-radius: 6px;
      overflow: hidden;
      white-space: normal;
    }
    .msg .code-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 4px 2px 8px;
      background: #24203a;
      color: #8a84a8;
      font-size: 11px;
    }
    .msg .code-head button {
      background: none;
      border: 1px solid #4a4468;
      color: #e8e4f5;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 11px;
      cursor: pointer;
    }
    .msg .code pre {
      margin: 0;
      padding: 8px;
      overflow-x: auto;
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 12px;
      line-height: 1.35;
      white-space: pre;
      user-select: text;
    }
    .msg .warn { margin-top: 4px; }
    .msg.sys {
      align-self: center;
      background: none;
      color: #8a84a8;
      font-size: 11px;
    }
    #inputrow {
      display: flex;
      align-items: flex-end; /* buttons stay at the bottom as the input grows */
      gap: 6px;
      padding: 10px;
      background: #2a2540;
    }
    #input {
      flex: 1;
      background: #1e1b2e;
      border: 1px solid #4a4468;
      color: #e8e4f5;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
      line-height: 1.4;
      outline: none;
      resize: none; /* grows with its text instead, up to max-height */
      overflow-y: auto;
      max-height: 160px;
    }
    #send {
      background: #7a5fd0;
      border: none;
      color: white;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 13px;
    }
    #send:disabled { opacity: 0.5; cursor: default; }
    #speak {
      background: #2f2a48;
      border: 1px solid #4a4468;
      color: #e8e4f5;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 13px;
    }
    #speak.off { opacity: 0.45; }
    #mic {
      background: #2f2a48;
      border: 1px solid #4a4468;
      color: #e8e4f5;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 13px;
    }
    #mic[hidden] { display: none; }
    #mic.rec { background: #b3404a; border-color: #d0606a; animation: pulse 1s infinite; }
    #mic:disabled, #talk:disabled { opacity: 0.45; cursor: default; }
    #talk {
      background: #2f2a48;
      border: 1px solid #4a4468;
      color: #e8e4f5;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 13px;
    }
    #talk[hidden] { display: none; }
    #talk.on { background: #2f7a5a; border-color: #4fb08a; }
    #convStatus {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      font-size: 11px;
      color: #b8b2d6;
      background: #24203a;
    }
    #convStatus[hidden] { display: none; }
    #convStatus .dot { width: 8px; height: 8px; border-radius: 50%; background: #6a6488; }
    #convStatus.listening .dot { background: #4fd08a; }
    #convStatus.hearing .dot { background: #e0506a; animation: pulse 0.6s infinite; }
    #convStatus.pet .dot { background: #a080f0; }
    #convStatus.busy .dot { background: #e0b040; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.6; } }
  </style>
</head>
<body>
  <div id="titlebar">
    <span id="petName">Chat</span>
    <div>
      <button id="hush" title="Stop talking" disabled>⏹</button>
      <button id="clear" title="Clear chat history">🗑</button>
      <button id="speak" title="Toggle TTS">🔊</button>
      <button id="close">✕</button>
    </div>
  </div>
  <div id="messages"></div>
  <div id="convStatus" hidden><span class="dot"></span><span id="convText"></span></div>
  <div id="inputrow">
    <textarea id="input" rows="1" placeholder="Say something…" autocomplete="off" title="Enter sends · Shift+Enter starts a new line"></textarea>
    <button id="mic" title="Click to talk, click again to send" hidden>🎤</button>
    <button id="talk" title="Conversation mode: just talk, she answers when you pause" aria-pressed="false" hidden>🗣</button>
    <button id="send">Send</button>
  </div>
  <script src="../renderer/tagParser.js"></script>
  <script src="conversation.js"></script>
  <script src="chat.js"></script>
</body>
</html>
